<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waykeepers</title>
<style>
  html,body,#app{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e12;color:#eee;font-family:system-ui,sans-serif;}
  canvas{display:block;}
  #ui{position:fixed;inset:0;pointer-events:none;}
  .menu{pointer-events:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);gap:12px;}
  .menu button{padding:10px 24px;font-size:18px;cursor:pointer;}
  .hidden{display:none!important;}
  #hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;}
  .bar{width:240px;height:14px;background:rgba(0,0,0,0.5);border:1px solid #888;}
  .fill{height:100%;background:#c44;}
  .stamina{background:#44c;}
  .charges{font-size:14px;}
  #objective{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);padding:6px 12px;font-size:14px;}
  #interact{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:6px 12px;font-size:14px;}
  #enemyhp{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:220px;}
  #bosshp{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:420px;display:none;}
  #dialogue{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);max-width:60%;background:rgba(0,0,0,0.7);padding:12px;font-size:16px;display:none;}
  #saveindicator{position:absolute;right:12px;top:12px;font-size:12px;opacity:0;transition:opacity .3s;}
</style>
  <script type="module" crossorigin src="./assets/index-BEQ26QzZ.js"></script>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="title" class="menu">
    <h1>Waykeepers</h1>
    <p>Light the Road</p>
    <button id="btnContinue">Continue</button>
    <button id="btnNew">New Game</button>
    <button id="btnSettings">Settings</button>
  </div>
  <div id="pause" class="menu hidden">
    <h2>Paused</h2>
    <button id="btnResume">Resume</button>
    <button id="btnJournal">Journal</button>
    <button id="btnSettings2">Settings</button>
    <button id="btnTitle">Return to Title</button>
  </div>
  <div id="journal" class="menu hidden">
    <h2>Journal</h2>
    <div id="journalText"></div>
    <button id="btnJournalClose">Close</button>
  </div>
  <div id="settings" class="menu hidden">
    <h2>Settings</h2>
    <label>Sensitivity <input id="sens" type="range" min="0.001" max="0.01" step="0.001" value="0.004"></label><br>
    <label>Invert Y <input id="invert" type="checkbox"></label><br>
    <label>Text scale <input id="textscale" type="range" min="0.8" max="1.4" step="0.1" value="1"></label><br>
    <label>Music <input id="musicvol" type="range" min="0" max="1" step="0.1" value="0.5"></label><br>
    <label>SFX <input id="sfxvol" type="range" min="0" max="1" step="0.1" value="0.7"></label><br>
    <label>Quality <select id="quality"><option>high</option><option>low</option></select></label><br>
    <button id="btnSettingsClose">Close</button>
  </div>
  <div id="hud" class="hidden">
    <div>Health <div class="bar"><div id="hpfill" class="fill"></div></div></div>
    <div>Stamina <div class="bar"><div id="stfill" class="fill stamina"></div></div></div>
    <div class="charges">Heals: <span id="charges">2</span></div>
  </div>
  <div id="objective" class="hidden"></div>
  <div id="interact" class="hidden"></div>
  <div id="enemyhp" class="hidden"><div class="bar"><div id="enemyhpfill" class="fill"></div></div></div>
  <div id="bosshp" class="hidden"><div style="text-align:center">Gate Warden</div><div class="bar"><div id="bosshpfill" class="fill"></div></div></div>
  <div id="dialogue"></div>
  <div id="saveindicator">Saved</div>
</div>
</body>
</html>
